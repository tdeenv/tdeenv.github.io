<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Theo Gaiyasudeen</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --surface: #f7f7f5; --border: #e8e8e8;
      --text: #111111; --muted: #999999; --accent: #00AAAA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; -webkit-font-smoothing: antialiased; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 56px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; color: var(--text); text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.72rem; color: var(--muted); text-decoration: none; letter-spacing: 0.06em; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }

    .page { max-width: 760px; margin: 0 auto; padding: 10rem 2.5rem 7rem; }
    .page-eyebrow { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
    .page-title {
      font-family: 'Syne', sans-serif; font-size: clamp(2.4rem, 5vw, 3.5rem);
      font-weight: 800; letter-spacing: -0.03em; line-height: 1;
      color: var(--text); margin-bottom: 4rem;
    }

    .post-list { display: flex; flex-direction: column; }

    .post-link {
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 2rem;
      text-decoration: none;
      padding: 1.8rem 0;
      border-top: 1px solid var(--border);
      transition: padding-left 0.2s;
    }
    .post-link:last-child { border-bottom: 1px solid var(--border); }
    .post-link:hover { padding-left: 0.5rem; }
    .post-link:hover .post-arrow { color: var(--accent); }
    .post-link:hover .post-title { color: var(--accent); }

    .post-left {}
    .post-cats {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem;
    }
    .post-cat { font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .post-title {
      font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700;
      color: var(--text); margin-bottom: 0.4rem; transition: color 0.2s;
    }
    .post-excerpt { font-size: 0.76rem; color: var(--muted); line-height: 1.6; }

    .post-right { text-align: right; flex-shrink: 0; }
    .post-date { font-size: 0.65rem; color: var(--muted); display: block; margin-bottom: 0.5rem; }
    .post-arrow { font-size: 1rem; color: var(--muted); transition: color 0.2s; }

    footer {
      border-top: 1px solid var(--border); padding: 1.8rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      max-width: 760px; margin: 0 auto;
    }
    footer span { font-size: 0.68rem; color: var(--muted); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">TG</a>
  <ul class="nav-links">
    <li><a href="index.html">home</a></li>
    <li><a href="about.html">about</a></li>
    <li><a href="experience.html">experience</a></li>
    <li><a href="projects.html">projects</a></li>
    <li><a href="blog.html" class="active">blog</a></li>
  </ul>
</nav>

<main class="page">
  <p class="page-eyebrow">// blog</p>
  <h1 class="page-title">Writing</h1>

  <div class="post-list">

    <a href="blog/social-impact-summit-2025.html" class="post-link">
      <div class="post-left">
        <div class="post-cats">
          <span class="post-cat">Data</span>
          <span class="post-cat">Social Impact</span>
        </div>
        <h2 class="post-title">Attending the Social Impact Summit 2025</h2>
        <p class="post-excerpt">Insights from a day of sessions on consortia, measurement, and social procurement.</p>
      </div>
      <div class="post-right">
        <span class="post-date">Apr 2025</span>
        <span class="post-arrow">→</span>
      </div>
    </a>

    <!-- Add more posts here following the same pattern -->

  </div>
</main>

<footer>
  <span>Theo Gaiyasudeen</span>
  <span>Sydney, AU</span>
</footer>

</body>
</html>
