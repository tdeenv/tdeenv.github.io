<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Theo Gaiyasudeen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          colors: {
            codex: '#00AAAA'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="font-sans bg-white text-black">

  <!-- NAVBAR -->
  <nav class="flex justify-center space-x-6 text-sm text-gray-600 py-4 sticky top-0 bg-white z-50">
     <a href="index.html" class="hover:text-codex">home</a>
    <a href="index.html" class="hover:text-codex">about</a>
    <a href="experience.html" class="hover:text-codex">experience</a>
    <a href="projects.html" class="hover:text-codex">projects</a>
    <a href="blog.html" class="hover:text-codex font-semibold text-codex">blog</a>
  </nav>

  <!-- BLOG POSTS -->
  <main class="px-6 py-16 max-w-4xl mx-auto">
    <h1 class="text-4xl font-bold mb-12 text-center">Blog</h1>
    <div class="space-y-6">
      <div onclick="openModal('post1')" class="cursor-pointer bg-gray-100 p-6 rounded-lg shadow hover:shadow-lg transition">
        <h2 class="text-2xl font-semibold mb-2">Post Title One</h2>
        <p class="text-gray-600 text-sm mb-2">April 2025 · Data, Social Impact</p>
        <p class="text-gray-800">This is a short preview of the first blog post. Click to read the full post.</p>
      </div>
      <div onclick="openModal('post2')" class="cursor-pointer bg-gray-100 p-6 rounded-lg shadow hover:shadow-lg transition">
        <h2 class="text-2xl font-semibold mb-2">Post Title Two</h2>
        <p class="text-gray-600 text-sm mb-2">March 2025 · Urban Planning</p>
        <p class="text-gray-800">This is a short preview of the second blog post. Click to read the full post.</p>
      </div>
    </div>
  </main>

  <!-- MODALS -->
  <div id="post1" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white text-black w-[95%] max-w-6xl max-h-[90vh] overflow-y-auto mx-auto p-10 rounded-xl shadow-xl relative modal-content"></div>
  </div>

  <div id="post2" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white text-black w-[95%] max-w-6xl max-h-[90vh] overflow-y-auto mx-auto p-10 rounded-xl shadow-xl relative modal-content"></div>
  </div>

  <script src="blogPosts.js"></script>
  <script>
    function openModal(id) {
      const post = blogPosts.find(p => p.id === id);
      if (!post) return;

      const modal = document.getElementById(id);
      const container = modal.querySelector('.modal-content');

      container.innerHTML = `
        <button onclick="closeModal('${id}')" class="absolute top-3 right-4 text-2xl text-gray-600 hover:text-black">&times;</button>
        <h2 class="text-3xl font-bold mb-2">${post.title}</h2>
        <p class="text-sm text-gray-500 mb-4">${post.date}</p>
        <div class="prose max-w-none">${marked.parse(post.markdown)}</div>
      `;

      modal.classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('backdrop-blur-sm')) {
        e.target.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
